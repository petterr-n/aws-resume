name: Backend

on:
  push:
    branches: [main, rebuild]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'template.yaml'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy-sam.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'template.yaml'

concurrency:
  # Never let two deploys race for the same CloudFormation stack.
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  STACK_NAME: resume-app-stack
  ARTIFACTS_BUCKET: petter-rn-sam-artifacts

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint CloudFormation templates
        run: cfn-lint template.yaml bootstrap/github-oidc.yaml

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy
    needs: test
    # Only main deploys. A push to a working branch runs tests and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Short-lived credentials minted per run. Replaces the static
          # access keys that previously lived in repo secrets.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: pip install aws-sam-cli

      - name: Build
        env:
          SAM_CLI_TELEMETRY: 0
        run: sam build

      - name: Deploy
        env:
          SAM_CLI_TELEMETRY: 0
        # No continue-on-error. A failed deploy must fail the workflow —
        # silently ignoring it is how the stack drifted from the template.
        # --no-fail-on-empty-changeset keeps genuine no-op deploys green.
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-resolve-s3 \
            --parameter-overrides AlertEmail="${{ vars.ALERT_EMAIL }}"

      - name: Smoke test the deployed endpoints
        run: |
          BASE=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text)
          echo "Testing $BASE"

          fail=0
          for path in visitor f1 football; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$BASE/$path")
            echo "  /$path -> $code $(head -c 120 /tmp/body)"
            # 5xx means our code broke. A 502/504 from the sports routes means
            # an upstream feed is down, which is not our deploy's fault.
            if [ "$code" -ge 500 ] && [ "$path" = "visitor" ]; then fail=1; fi
            if [ "$code" = "500" ]; then fail=1; fi
          done
          exit $fail
