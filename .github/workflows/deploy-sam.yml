name: Backend

on:
  push:
    branches: [main, rebuild]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'template.yaml'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy-sam.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'template.yaml'

concurrency:
  # Never let two deploys race for the same CloudFormation stack.
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  STACK_NAME: resume-app-stack
  ARTIFACTS_BUCKET: petter-rn-sam-artifacts

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          # setup-python only looks for requirements.txt / pyproject.toml by
          # default and fails the step outright when it finds neither.
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint CloudFormation templates
        run: cfn-lint template.yaml bootstrap/github-oidc.yaml

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy
    needs: test
    # Only main deploys. A push to a working branch runs tests and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Short-lived credentials minted per run. Replaces the static
          # access keys that previously lived in repo secrets.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: pip install aws-sam-cli

      - name: Build
        env:
          SAM_CLI_TELEMETRY: 0
        run: sam build

      - name: Deploy
        env:
          SAM_CLI_TELEMETRY: 0
        # No continue-on-error. A failed deploy must fail the workflow —
        # silently ignoring it is how the stack drifted from the template.
        # --no-fail-on-empty-changeset keeps genuine no-op deploys green.
        run: |
          # AlertEmail is optional, but `--parameter-overrides AlertEmail=`
          # with an empty value is a parse error rather than an empty string,
          # so the flag has to be omitted entirely when it is unset.
          overrides=()
          if [ -n "${{ vars.ALERT_EMAIL }}" ]; then
            overrides=(--parameter-overrides "AlertEmail=${{ vars.ALERT_EMAIL }}")
          else
            echo "::notice::ALERT_EMAIL not set — deploying without error alarms."
          fi

          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-resolve-s3 \
            "${overrides[@]}"

      - name: Smoke test the deployed endpoint
        run: |
          BASE=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text)

          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$BASE/api/visitor")
          body=$(cat /tmp/body)
          echo "GET $BASE/api/visitor -> $code $body"

          if [ "$code" != "200" ]; then
            echo "::error::Expected 200, got $code"
            exit 1
          fi

          # The old failure mode returned 200 with an error body, so status
          # alone is not enough — require an actual integer count.
          echo "$body" | grep -Eq '"count"[[:space:]]*:[[:space:]]*[0-9]+' || {
            echo "::error::Response has no numeric count field"
            exit 1
          }
