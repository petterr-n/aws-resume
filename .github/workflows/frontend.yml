name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'website/**'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  SITE_BUCKET: cloud-resume-challenge-petterr-n

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` installs exactly what the lockfile pins. `npm install` can
      # silently resolve different versions than the ones tested locally.
      - run: npm ci
        working-directory: website

      - run: npm run lint
        working-directory: website

      - run: npm run build
        working-directory: website

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/dist
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes, because these files want opposite caching.
      #
      # This bucket no longer holds SAM packaging artifacts, so --delete is
      # safe. Previously both workflows pointed at this bucket and this sync
      # was erasing the artifacts CloudFormation needed for updates and
      # rollbacks.
      # data/* is written by the hydrator Lambda, not by this build. It must be
      # excluded from a --delete sync or every frontend deploy would erase the
      # published results — the same class of bug as sharing a bucket with SAM.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync dist/ "s3://$SITE_BUCKET" \
            --delete \
            --exclude '*.html' \
            --exclude '*.json' \
            --exclude 'data/*' \
            --cache-control 'public, max-age=31536000, immutable'

      - name: Upload entry points
        run: |
          aws s3 sync dist/ "s3://$SITE_BUCKET" \
            --exclude '*' \
            --include '*.html' \
            --include '*.json' \
            --exclude 'data/*' \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$CLOUDFRONT_ID" ]; then
            echo "::error::CLOUDFRONT_DISTRIBUTION_ID is not set — visitors will keep seeing the old build."
            exit 1
          fi
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" --id "$id"
          echo "Invalidation $id complete."
