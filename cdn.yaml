AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Site bucket and CloudFront distribution for petter-rn.no.

  These resources were created by hand before this template existed. They are
  adopted with a CloudFormation *resource import* rather than recreated —
  recreating the distribution would mean releasing the petter-rn.no alias,
  waiting out a new deployment, and taking the site down for no benefit.

  IMPORTANT: on the initial import this template must describe the resources
  EXACTLY as they exist. Any difference is applied as a change on the next
  stack update, which is how an import turns into an outage. Property values
  below were read from the live resources, not chosen.

  Note also that an import change set rejects any template containing Outputs,
  and that AWS::S3::BucketPolicy does not support drift detection, so it will
  not appear in a drift report.

Parameters:
  SiteBucketName:
    Type: String
    Default: cloud-resume-challenge-petterr-n

  CertificateId:
    Type: String
    Default: f762271f-acb5-496f-9d5c-72a9e4fad02a
    Description: >
      ACM certificate for petter-rn.no, referenced rather than managed here:
      CloudFront certificates must live in us-east-1 while this stack is in
      eu-north-1, so the resource cannot belong to it. Only the certificate id
      is given; the account number is filled in at deploy time so it does not
      appear in this public repository.

  ApiOriginDomain:
    Type: String
    Default: haianwilra.execute-api.eu-north-1.amazonaws.com
    Description: >
      HTTP API hostname from the resume-app-stack ApiOriginDomain output.
      Served under /api/* so the browser talks to one origin.

  OriginAccessControlId:
    Type: String
    Default: E13FF2VGWEMSJL
    Description: >
      Existing OAC, already attached to the distribution and already reflected
      in the bucket policy. Referenced by id so the import does not try to
      create a second one.

Resources:

  # AllViewerExceptHostHeader forwards what the viewer sent, but the rate
  # limiter needs CloudFront-Viewer-Address, which CloudFront generates and the
  # client cannot forge. X-Forwarded-For is not a substitute: CloudFront
  # appends to whatever the client supplied, so a caller can prepend any
  # address they like and defeat a per-visitor limit keyed on it.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-origin'
        Comment: Viewer headers except Host, plus the CloudFront-generated address.
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - host

  # DeletionPolicy: Retain is mandatory on every resource in an import
  # operation. It also means deleting this stack detaches these resources
  # rather than destroying the site.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      # The OAC bucket policy grants a service principal with a SourceArn
      # condition, which S3 does not evaluate as a public policy — so these
      # guardrails can be on without breaking CloudFront's access.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${SiteBucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  Distribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ''
        Aliases:
          - petter-rn.no
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        IPV6Enabled: true

        Origins:
          - Id: s3-origin-cloud-resume-challenge-petterr-n
            DomainName: !Sub '${SiteBucketName}.s3.eu-north-1.amazonaws.com'
            OriginAccessControlId: !Ref OriginAccessControlId
            S3OriginConfig:
              OriginAccessIdentity: ''

          - Id: api-origin
            DomainName: !Ref ApiOriginDomain
            # The API's routes live under the 'prod' stage, so CloudFront
            # prepends it: a request for /api/visitor reaches the API as
            # /prod/api/visitor, which is why template.yaml declares that route.
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]

        DefaultCacheBehavior:
          TargetOriginId: s3-origin-cloud-resume-challenge-petterr-n
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [HEAD, GET]
          CachedMethods: [HEAD, GET]
          Compress: true
          # Managed CachingOptimized. Replaces the deprecated ForwardedValues
          # block, which CloudFront keeps only for backwards compatibility.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

        CacheBehaviors:
          # This is what makes the API same-origin. With the browser calling
          # petter-rn.no/api/* instead of a separate execute-api host, there is
          # no cross-origin request left for CORS to govern, and API traffic
          # falls under CloudFront's free tier rather than API Gateway's
          # per-request price.
          - PathPattern: /api/*
            TargetOriginId: api-origin
            ViewerProtocolPolicy: https-only
            # POST is required for /api/ask. CloudFront only accepts three
            # method sets, so enabling POST means enabling the full set; the
            # API itself still only routes the methods it declares.
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # CachingDisabled: the only endpoint today is the visitor counter,
            # which increments per call and must never be served from cache.
            # Cacheable endpoints get their own behaviour when they exist.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Strips Host — API Gateway rejects a Host header that does not
            # match its own domain — and adds CloudFront-Viewer-Address.
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /error.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /error.html

        ViewerCertificate:
          AcmCertificateArn: !Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${CertificateId}'
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

# Outputs could not be part of the import change set — CloudFormation rejects
# any import template containing them. Added here in the first ordinary update.
Outputs:
  DistributionId:
    Description: CloudFront distribution serving petter-rn.no.
    Value: !Ref Distribution

  DistributionDomain:
    Value: !GetAtt Distribution.DomainName

  SiteBucket:
    Description: Frontend deploys sync the built site here.
    Value: !Ref SiteBucket

# Still deliberately unchanged:
#   PriceClass_All   PriceClass_100 (US/EU only) would be cheaper in principle,
#                    but CloudFront's free tier already covers this site's
#                    volume entirely, so it would save nothing and would slow
#                    the site down for anyone outside Europe and North America.
