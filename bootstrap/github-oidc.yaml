AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap for petter-rn.no. Creates the GitHub OIDC trust, the
  deploy role that GitHub Actions assumes, and the private S3 bucket SAM
  packages into. Deploy this by hand once — the CI pipeline cannot create the
  role that grants the CI pipeline its own permissions.

Parameters:
  GitHubRepo:
    Type: String
    Default: petterr-n/aws-resume
    Description: owner/repo that is allowed to assume the deploy role.

  AllowedRefs:
    Type: String
    Default: '*'
    Description: >
      Which refs may assume the role. '*' allows any branch — convenient while
      rebuilding. Tighten to 'ref:refs/heads/main' once the rebuild is merged.

  ArtifactsBucketName:
    Type: String
    Default: petter-rn-sam-artifacts
    Description: >
      Private bucket for SAM packaging artifacts. Must be globally unique and
      MUST NOT be the bucket the website is synced into — the frontend workflow
      syncs with --delete, which would erase these artifacts.

  StackNamePrefix:
    Type: String
    Default: resume-app
    Description: IAM permissions are scoped to stacks and roles with this prefix.

Resources:

  # AWS stopped relying on this thumbprint for token.actions.githubusercontent.com
  # (it validates against its own trust store), but the property is still required.
  # If this fails with "provider already exists", you already have one — delete
  # this resource from the template and point DeployRole at the existing ARN.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackNamePrefix}-github-deploy'
      Description: Assumed by GitHub Actions via OIDC. Replaces long-lived access keys.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:${AllowedRefs}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: CloudFormationOnOwnStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'

              - Sid: CloudFormationValidate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'

              - Sid: ArtifactAndSiteBuckets
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactsBucketName}'
                  - !Sub 'arn:aws:s3:::${ArtifactsBucketName}/*'
                  - arn:aws:s3:::cloud-resume-challenge-petterr-n
                  - arn:aws:s3:::cloud-resume-challenge-petterr-n/*

              - Sid: ServerlessResources
                Effect: Allow
                Action:
                  - lambda:*
                  - apigateway:*
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:ListTagsOfResource
                  - scheduler:*
                  - events:*
                  - logs:*
                  - xray:*
                Resource: '*'

              - Sid: PassAndManageStackRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StackNamePrefix}-*'

              - Sid: ReadDeployTimeParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/petter-rn/*'

              - Sid: InvalidateCdn
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Packaging artifacts are disposable once a deploy settles. Expiring
          # them keeps this bucket effectively free.
          - Id: expire-old-artifacts
            Status: Enabled
            NoncurrentVersionExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repo as the AWS_ROLE_ARN secret.
    Value: !GetAtt DeployRole.Arn

  ArtifactsBucket:
    Description: Pass to sam package --s3-bucket.
    Value: !Ref ArtifactsBucket
