AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  petter-rn.no backend. An HTTP API in front of a single visitor-counter
  Lambda and its DynamoDB table. Every resource the application needs is
  defined here — nothing is created by hand, so the stack can be deleted and
  redeployed from scratch.

Parameters:
  SiteBucketName:
    Type: String
    Default: cloud-resume-challenge-petterr-n
    Description: >
      Bucket CloudFront serves the site from. The hydrator publishes
      data/results.json here so the browser reads it straight from the CDN.
      Passed as a parameter rather than imported from the CDN stack, so the two
      stacks stay independently deletable.

  FootballApiKeyParameter:
    Type: String
    Default: /petter-rn/football-api-key
    Description: >
      SSM SecureString holding the football-data.org key. Read at runtime, not
      injected as an environment variable: CloudFormation cannot resolve
      ssm-secure into Lambda env vars, and this keeps the secret out of the
      function configuration and rotatable without a redeploy. If the parameter
      does not exist, the hydrator skips football and still publishes F1.

  HydrationSchedule:
    Type: String
    Default: rate(30 minutes)
    Description: >
      ~1,440 invocations a month, comfortably inside Lambda's perpetual free
      tier. Neither feed changes faster than this.

  AskModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock inference profile for the Q&A endpoint. Must be a profile id
      (eu.* or global.*), not a bare model id — the bare id returns a
      validation error for these models. Opus 5 is not enabled on this account;
      enabling it in Bedrock > Model access makes this a one-line change.

  PerVisitorHourly:
    Type: Number
    Default: 20
    Description: >
      Questions one visitor may ask per hour. A courtesy limit, not a cost
      control — the global daily cap is what bounds spend, so this can be
      generous. It is keyed on IP address, which means everyone behind one NAT
      shares a single allowance: a recruiter's whole office counts as one
      visitor. 5/hour was too tight for that, and refusing a second colleague
      mid-conversation is a worse outcome than the extra questions cost.

  GlobalDaily:
    Type: Number
    Default: 100
    Description: >
      Questions answered per day across all visitors. This is the real ceiling
      on spend — a per-visitor limit does not bound cost, because addresses are
      cheap and a determined caller has many.

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional. If set, receives an email when the function starts erroring.
      AWS sends a confirmation link that must be clicked before it works.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]          # ~20% cheaper per GB-second than x86_64
    Timeout: 10
    MemorySize: 256
    Tracing: Active                 # X-Ray: 100k traces/month free
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:

  ### API ###############################################################

  # HTTP API rather than REST: same features here at $1.00/M instead of
  # $3.50/M, and it sends payload format 2.0, which is what the handler parses.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      # No CorsConfiguration: CloudFront serves this API from /api/* on
      # petter-rn.no, so the browser never makes a cross-origin request and
      # there is nothing for CORS to permit. The API is still reachable on its
      # execute-api hostname, but nothing calls it that way.

      # Throttling is the cheapest possible guard against someone deciding to
      # hammer the counter. Well above real traffic, well below a surprise bill.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ### Data ##############################################################

  VisitorTable:
    Type: AWS::DynamoDB::Table
    # Retained on stack delete so an accidental teardown cannot silently
    # discard the count. Delete it explicitly when you actually mean to.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ### Q&A over the CV ###################################################

  # Rate-limit counters only. Separate from the visitor table so enabling TTL
  # here cannot expire the visitor count, and so the two concerns stay legible.
  AskLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # Counters are worthless once their window closes. TTL deletes are free,
      # unlike ordinary deletes, so expiry costs nothing.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ask/
      Handler: app.lambda_handler
      Description: Answers questions about the CV, grounded in cv.json.
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          MODEL_ID: !Ref AskModelId
          LIMITS_TABLE: !Ref AskLimitsTable
          SITE_BUCKET: !Ref SiteBucketName
          CV_KEY: cv.json
          PER_VISITOR_HOURLY: !Ref PerVisitorHourly
          GLOBAL_DAILY: !Ref GlobalDaily
          # Per-stack salt for hashing visitor addresses. Never leaves the
          # account, and combined with a daily rotation it means stored keys
          # cannot be correlated across days or back to an address.
          HASH_SALT: !Ref AWS::StackId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AskLimitsTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::${SiteBucketName}/cv.json'
            # Scoped to the one model this function may call. Without the
            # resource constraint a bug or an injected model id could invoke
            # anything in Bedrock, at any price.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${AskModelId}'
                - !Sub 'arn:aws:bedrock:*::foundation-model/*'
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/ask
            Method: POST

  AskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AskFunction}'
      RetentionInDays: 30

  ### Function ##########################################################

  VisitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/visitor/
      Handler: app.lambda_handler
      Description: Increments and returns the visitor count.
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitorTable
      Policies:
        # Scoped to this table only — not a blanket DynamoDB grant.
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
      Events:
        # CloudFront serves /api/* from this API with OriginPath /prod, so a
        # browser request for petter-rn.no/api/visitor arrives here as
        # /prod/api/visitor. The transitional bare /visitor route has been
        # removed now that the deployed frontend no longer calls it.
        GetVisitor:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/visitor
            Method: GET

  ### Hydrator #########################################################

  # Reads the upstream feeds on a timer and publishes a static JSON file the
  # CDN serves. Nothing invokes a Lambda to read this data.
  HydratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hydrator/
      Handler: app.lambda_handler
      Description: Publishes F1 and football results to the site bucket on a schedule.
      Timeout: 30
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucketName
          RESULTS_KEY: data/results.json
          FOOTBALL_API_KEY_PARAMETER: !Ref FootballApiKeyParameter
      Policies:
        # Write access to one prefix of one bucket — not the bucket, and
        # certainly not S3. Reading is needed too, to retain the previous
        # value when a feed is unreachable.
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub 'arn:aws:s3:::${SiteBucketName}/data/*'
            # Required so a missing object returns NoSuchKey rather than
            # AccessDenied. Without s3:ListBucket, S3 refuses to confirm
            # whether a key exists and returns 403 for both cases — which
            # makes the first run, before results.json exists, indistinguishable
            # from a genuine permissions failure. Grants key listing only; the
            # object permissions above still limit reads and writes to data/.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:aws:s3:::${SiteBucketName}'
        - SSMParameterReadPolicy:
            ParameterName: petter-rn/football-api-key
      Events:
        Tick:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref HydrationSchedule
            Description: Refresh the published results file.

  HydratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HydratorFunction}'
      RetentionInDays: 30

  # Without this, the log group is created with retention "never expire" and
  # CloudWatch storage grows forever.
  VisitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${VisitorFunction}'
      RetentionInDays: 30

  ### Alerting ##########################################################

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      DisplayName: resume-api alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # This is the alarm that would have told you the API was down, instead of
  # it returning errors unnoticed for months.
  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: The visitor counter Lambda is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      Dimensions:
        - Name: FunctionName
          Value: !Ref VisitorFunction

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: The HTTP API is returning 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi

Outputs:
  AskLimits:
    Description: Enforced question limits.
    Value: !Sub '${PerVisitorHourly}/visitor/hour, ${GlobalDaily}/day total'

  ApiBaseUrl:
    Description: Base URL for the API. Becomes the CloudFront /api/* origin.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  ApiOriginDomain:
    Description: Hostname only — this is what you enter as a CloudFront origin.
    Value: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  VisitorTableName:
    Description: Generated table name. Nothing hardcodes this.
    Value: !Ref VisitorTable

  ResultsUrl:
    Description: Where the frontend reads the hydrated results from.
    Value: https://petter-rn.no/data/results.json
