AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  petter-rn.no backend. An HTTP API in front of a single visitor-counter
  Lambda and its DynamoDB table. Every resource the application needs is
  defined here — nothing is created by hand, so the stack can be deleted and
  redeployed from scratch.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://petter-rn.no,https://www.petter-rn.no,http://localhost:5173'
    Description: >
      Browser origins permitted to call the API. Replaces the previous
      Allow-Origin '*'. Once the API is served from /api/* on the same
      CloudFront distribution as the site, calls become same-origin and this
      whole CORS block can be deleted.

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional. If set, receives an email when the function starts erroring.
      AWS sends a confirmation link that must be clicked before it works.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]          # ~20% cheaper per GB-second than x86_64
    Timeout: 10
    MemorySize: 256
    Tracing: Active                 # X-Ray: 100k traces/month free
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:

  ### API ###############################################################

  # HTTP API rather than REST: same features here at $1.00/M instead of
  # $3.50/M, and it sends payload format 2.0, which is what the handler parses.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
      # Throttling is the cheapest possible guard against someone deciding to
      # hammer the counter. Well above real traffic, well below a surprise bill.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ### Data ##############################################################

  VisitorTable:
    Type: AWS::DynamoDB::Table
    # Retained on stack delete so an accidental teardown cannot silently
    # discard the count. Delete it explicitly when you actually mean to.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ### Function ##########################################################

  VisitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/visitor/
      Handler: app.lambda_handler
      Description: Increments and returns the visitor count.
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitorTable
      Policies:
        # Scoped to this table only — not a blanket DynamoDB grant.
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
      Events:
        GetVisitor:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /visitor
            Method: GET

  # Without this, the log group is created with retention "never expire" and
  # CloudWatch storage grows forever.
  VisitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${VisitorFunction}'
      RetentionInDays: 30

  ### Alerting ##########################################################

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      DisplayName: resume-api alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # This is the alarm that would have told you the API was down, instead of
  # it returning errors unnoticed for months.
  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: The visitor counter Lambda is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      Dimensions:
        - Name: FunctionName
          Value: !Ref VisitorFunction

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: The HTTP API is returning 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi

Outputs:
  ApiBaseUrl:
    Description: Base URL for the API. Becomes the CloudFront /api/* origin.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  ApiOriginDomain:
    Description: Hostname only — this is what you enter as a CloudFront origin.
    Value: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  VisitorTableName:
    Description: Generated table name. Nothing hardcodes this.
    Value: !Ref VisitorTable
