<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Petter Rønning-Nyvold – CV</title>
    <meta
      name="description"
      content="CV for Petter Rønning-Nyvold – utvikler med master i programvareutvikling, med erfaring fra maskinsyn, backend og skyutvikling på AWS."
    />
    <meta name="theme-color" content="#f6f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1a20" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
    />

    <script>
      // Runs before first paint so a returning dark-mode visitor never sees a
      // flash of the light theme.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            saved || (prefersDark ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
