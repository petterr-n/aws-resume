<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Siden finnes ikke – Petter Rønning-Nyvold</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .code { font-size: 4rem; font-weight: 700; color: #64748b; margin: 0; line-height: 1; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: #94a3b8; margin: 0 0 1.75rem; }
      a {
        display: inline-block;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 500;
      }
      a:hover { background: #1e40af; }
      a:focus-visible { outline: 2px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Denne siden finnes ikke</h1>
      <p>Lenken kan være utdatert, eller adressen feilskrevet.</p>
      <a href="/">Tilbake til forsiden</a>
    </main>
  </body>
</html>
